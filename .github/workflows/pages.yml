name: Publicar documentación

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: parcial_2

jobs:
  construir:
    name: Construir sitio Sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parcial_2/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Construir documentación
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: parcial_2/docs/_build/html

  publicar:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    needs: construir
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v5
