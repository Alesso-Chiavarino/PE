name: Controles del parcial 3

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    working-directory: parcial_2

jobs:
  calidad-estatica:
    name: Calidad estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parcial_2/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Ruff
        run: python -m ruff check . --output-format=github
      - name: mypy
        run: python -m mypy algoritmos_ordenamiento.py archivos.py configuracion.py detectores.py generador.py main.py medicion.py modelos.py monitoreo.py perfilado.py interfaz tests scripts
      - name: Radon y política de complejidad
        run: python -m scripts.verificar_complejidad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-complejidad
          path: parcial_2/reportes/complejidad.json
          if-no-files-found: warn

  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parcial_2/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - run: mkdir -p reportes
      - name: pytest con cobertura mínima del 90 por ciento
        run: >-
          python -m pytest
          --cov
          --cov-fail-under=90
          --cov-report=term-missing
          --cov-report=xml:reportes/coverage.xml
          --junitxml=reportes/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-pruebas
          path: |
            parcial_2/reportes/coverage.xml
            parcial_2/reportes/pytest.xml
          if-no-files-found: warn

  seguridad:
    name: Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parcial_2/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - run: mkdir -p reportes
      - name: Bandit bloquea severidad media o alta
        run: python -m bandit -r . -x ./.venv,./tests,./docs,./presentacion,./resultados -ll -f json -o reportes/bandit.json
      - name: pip-audit revisa dependencias
        run: >-
          python -m pip_audit -r requirements.txt
          --cache-dir reportes/.pip-audit-cache
          --format=json
          --output=reportes/pip-audit.json
      - name: Detectar secretos nuevos
        run: |
          detect-secrets scan --all-files --baseline .secrets.baseline
          git diff --exit-code --ignore-matching-lines='"generated_at":' .secrets.baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-seguridad
          path: |
            parcial_2/reportes/bandit.json
            parcial_2/reportes/pip-audit.json
            parcial_2/.secrets.baseline
          if-no-files-found: warn

  documentacion:
    name: Documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parcial_2/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Construir Sphinx sin advertencias
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Verificar enlaces
        run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@v4
        with:
          name: sitio-sphinx
          path: parcial_2/docs/_build/html

  rendimiento:
    name: Rendimiento y memoria
    runs-on: ubuntu-latest
    needs: [calidad-estatica, pruebas]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parcial_2/requirements-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Benchmark relativo
        run: python -m scripts.verificar_rendimiento
      - name: Límite de memoria del procesamiento por lotes
        run: python -m scripts.verificar_memoria
      - name: Profiling de CPU
        run: python main.py perfilado --transacciones 1000 --salida reportes/perfilado
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-rendimiento
          path: parcial_2/reportes
          if-no-files-found: warn
