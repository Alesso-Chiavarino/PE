[project]
name = "detector-transacciones-eficiente"
version = "2.0.0"
description = "Detector eficiente de transacciones sospechosas"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "snakeviz>=2.2.0",
    "sphinx>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["."]
