[project]
name = "detector-transacciones-eficiente"
version = "3.0.0"
description = "Detector eficiente de transacciones sospechosas"
requires-python = ">=3.10"
dependencies = [
    "matplotlib==3.11.2",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-benchmark==5.3.1",
    "pytest-cov==7.1.0",
    "radon==6.0.1",
    "ruff==0.17.4",
    "snakeviz==2.2.2",
    "sphinx==9.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["."]

[tool.coverage.run]
source = [
    "algoritmos_ordenamiento",
    "archivos",
    "configuracion",
    "detectores",
    "generador",
    "monitoreo",
]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "docs/_build",
    "presentacion",
    "resultados",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["docs", "presentacion", "resultados", "\\.venv"]
